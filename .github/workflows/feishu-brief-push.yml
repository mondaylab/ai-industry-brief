name: Feishu brief push

on:
  workflow_dispatch:
    inputs:
      date:
        description: Brief date in YYYY-MM-DD format
        required: true
        type: string
      worker_url:
        description: Worker base URL
        required: false
        type: string

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Send text card
        env:
          MANUAL_TRIGGER_TOKEN: ${{ secrets.WORKER_MANUAL_TRIGGER_TOKEN }}
          BRIEF_DATE: ${{ inputs.date }}
          FEISHU_PUSH_WORKER_URL: ${{ inputs.worker_url }}
        run: node workers/feishu-brief-push/scripts/post-publish-send.js --date "$BRIEF_DATE"
