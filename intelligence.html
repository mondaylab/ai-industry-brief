<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <meta name="robots" content="noindex" />
    <title>对应页面 | The AI Industry Brief</title>
  </head>
  <body>
    <p>正在进入对应页面……</p>
    <script>
      const current = new URL(window.location.href);
      const isPaperView = "intelligence" === "intelligence" && current.searchParams.get("view") === "papers";
      const target = new URL(isPaperView || "intelligence" === "papers" ? "./papers.html" : "./reader.html", current);
      for (const [key, value] of new URLSearchParams(window.location.search)) {
        if (key !== "view") target.searchParams.append(key, value);
      }
      target.hash = isPaperView || "intelligence" === "papers" ? current.hash : "#radar";
      window.location.replace(target.href);
    </script>
    <noscript><a href="reader.html#radar">进入对应页面</a></noscript>
  </body>
</html>
